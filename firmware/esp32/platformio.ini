[platformio]
default_envs = hardware_irl
src_dir = ../../FirmwareTest

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    bblanchon/ArduinoJson @ ^6.21.3

[env:hardware_irl]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11


