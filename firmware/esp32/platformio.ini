[platformio]
default_envs = hardware_irl
src_dir = NFCKey_Hardware_IRL

[env:hardware_irl]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyUSB0
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4
    miguelbalboa/MFRC522 @ ^1.4.11



