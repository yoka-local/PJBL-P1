<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Progress Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 40px; 
            color: #333;
            background-color: #f9f9f9;
        }
        h1 { text-align: center; margin-bottom: 40px; }
        .chart-container { 
            width: 80%; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .stats-table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .stats-table th, .stats-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .stats-table th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .stats-table tr:hover { background-color: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Project Contribution Progress</h1>
    
    <div class="chart-container">
        <canvas id="commitsChart"></canvas>
    </div>
    
    <div class="chart-container">
        <canvas id="linesChart"></canvas>
    </div>

    <table class="stats-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Total Commits</th>
                <th>yoka Commits</th>
                <th>Yorushika Commits</th>
                <th>Lines Added</th>
                <th>Lines Removed</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Populated by JS -->
        </tbody>
    </table>

    <script>
        const labels = ['2026-09-08', '2026-10-01', '2026-10-02', '2026-10-05', '2026-10-06', '2026-10-07', '2026-10-08'];
        const yokaCommits = [0, 10, 6, 6, 2, 2, 1];
        const yorushikaCommits = [7, 0, 6, 1, 0, 0, 0];
        
        const yokaLines = [0, 13774, 1800, 253, 176, 2433, 95];
        const yorushikaLines = [3966, 0, 41, 1, 0, 0, 0];

        const totalLinesAdded = yokaLines.map((val, i) => val + yorushikaLines[i]);
        // Computed from git log manually:
        const totalLinesRemoved = [2349, 185, 133, 243, 6, 13, 64];

        // Populate Table
        const tbody = document.getElementById('tableBody');
        for (let i = 0; i < labels.length; i++) {
            const totalCommits = yokaCommits[i] + yorushikaCommits[i];
            const row = `<tr>
                <td>${labels[i]}</td>
                <td>${totalCommits}</td>
                <td>${yokaCommits[i]}</td>
                <td>${yorushikaCommits[i]}</td>
                <td>+${totalLinesAdded[i].toLocaleString()}</td>
                <td>-${totalLinesRemoved[i].toLocaleString()}</td>
            </tr>`;
            tbody.innerHTML += row;
        }

        // Commits Chart
        const ctx1 = document.getElementById('commitsChart').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'yoka (Commits)',
                        data: yokaCommits,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Yorushika (Commits)',
                        data: yorushikaCommits,
                        backgroundColor: 'rgba(255, 99, 132, 0.7)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Commits per Day (Stacked)', font: { size: 18 } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Number of Commits' } }
                }
            }
        });

        // Lines Chart
        const ctx2 = document.getElementById('linesChart').getContext('2d');
        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'yoka (Lines Added)',
                        data: yokaLines,
                        backgroundColor: 'rgba(75, 192, 192, 0.7)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Yorushika (Lines Added)',
                        data: yorushikaLines,
                        backgroundColor: 'rgba(255, 159, 64, 0.7)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Lines of Code Added per Day (Stacked)', font: { size: 18 } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Lines Added' } }
                }
            }
        });
    </script>
</body>
</html>
